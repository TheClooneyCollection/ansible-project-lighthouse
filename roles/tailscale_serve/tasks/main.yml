---
- name: Deploy tailscale serve systemd unit
  become: true
  ansible.builtin.template:
    src: tailscale-serve.service.j2
    dest: "/etc/systemd/system/{{ tailscale_serve_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  register: tailscale_serve_unit

- name: Ensure tailscale serve service is enabled and {{ tailscale_serve_state }}
  become: true
  ansible.builtin.systemd:
    name: "{{ tailscale_serve_service_name }}"
    enabled: "{{ tailscale_serve_enabled }}"
    # Apply changes in this instance's scope, not a shared deferred handler.
    state: "{{ 'restarted' if tailscale_serve_unit is changed and tailscale_serve_state == 'started' else tailscale_serve_state }}"
    daemon_reload: true
